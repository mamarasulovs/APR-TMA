[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apr-tma"
version = "0.2.0"
description = "Acquisition Pipeline Randomization with Trace-Modulated Attention for domain-generalizable face anti-spoofing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "scikit-learn>=1.3",
  "torch>=2.1", "torchvision>=0.16", "timm>=0.9", "pyyaml>=6", "matplotlib>=3.7", "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["apr_tma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
